name: Daily update

on:
  schedule:
    - cron: "23 5 * * *"   # every day at 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Collect and verify
        id: update
        run: python -m onionindex.update

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: daily verification $(date -u +%F)"
            git push
          fi

      - name: Open or update the review issue
        if: steps.update.outputs.pending_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Review needed: onion address mismatch"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file data/pending.md
          else
            gh issue create --title "$title" --body-file data/pending.md
          fi
